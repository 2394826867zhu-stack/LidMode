name: Bug report
description: Report a reproducible LidMode defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include passwords, credentials, personal files, or sensitive logs. Report security issues privately through the Security tab.
  - type: input
    id: mac
    attributes:
      label: Mac model
      description: For example, MacBook Air M2.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.6"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LidMode version or commit
      placeholder: "1.2.0 (3) or git commit"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Scripts/install.sh from source
        - Locally built share package
        - Xcode build only
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the starting Normal/Awake state and the exact actions taken.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant output from Scripts/verify-install.sh after removing personal or sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This report contains no passwords, credentials, private keys, or personal files.
          required: true
        - label: I returned the Mac to Normal mode after testing, when possible.
          required: true
