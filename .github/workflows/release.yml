name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Test release source
        run: >-
          xcodebuild test
          -project LidMode.xcodeproj
          -scheme LidMode
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/LidModeTests"
          CODE_SIGNING_ALLOWED=NO
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/lidmode-signing.keychain-db"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode -o "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"
      - name: Build signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          xcodebuild build \
            -project LidMode.xcodeproj \
            -scheme LidMode \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/LidModeRelease" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application' \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS=--timestamp
      - name: Verify signatures
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/LidModeRelease/Build/Products/Release/LidMode.app"
          helper="$app/Contents/MacOS/LidModePrivilegedHelper"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$helper"
          app_team="$(codesign -dvvv "$app" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}')"
          helper_team="$(codesign -dvvv "$helper" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}')"
          test -n "$app_team"
          test "$app_team" = "$helper_team"
      - name: Notarize and staple
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/LidModeRelease/Build/Products/Release/LidMode.app"
          key="$RUNNER_TEMP/AuthKey.p8"
          archive="$RUNNER_TEMP/LidMode.zip"
          trap 'rm -f "$key" "$archive"' EXIT
          printf '%s' "$NOTARY_KEY" | base64 --decode -o "$key"
          chmod 600 "$key"
          ditto -c -k --keepParent "$app" "$archive"
          xcrun notarytool submit "$archive" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app="$RUNNER_TEMP/LidModeRelease/Build/Products/Release/LidMode.app"
          archive="$RUNNER_TEMP/LidMode-$version.zip"
          ditto -c -k --keepParent "$app" "$archive"
          gh release create "$GITHUB_REF_NAME" "$archive" --title "LidMode $version" --generate-notes
