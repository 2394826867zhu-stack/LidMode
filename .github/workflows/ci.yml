name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Validate source and scripts
        run: |
          set -euo pipefail
          /bin/bash -n Scripts/install.sh Scripts/uninstall.sh Scripts/verify-install.sh Scripts/build-share-package.sh Tests/helper-integration.sh
          xcrun swift-format lint --recursive LidMode Helper PrivilegedHelper Shared Tests
          plutil -lint LidMode/Info.plist PrivilegedHelper/app.lidmode.PrivilegedHelper.plist
      - name: Test
        run: >-
          xcodebuild test
          -project LidMode.xcodeproj
          -scheme LidMode
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/LidModeTests"
          CODE_SIGNING_ALLOWED=NO
      - name: Analyze
        run: >-
          xcodebuild analyze
          -project LidMode.xcodeproj
          -scheme LidMode
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/LidModeAnalyze"
          CODE_SIGNING_ALLOWED=NO
      - name: Release build
        run: >-
          xcodebuild build
          -project LidMode.xcodeproj
          -scheme LidMode
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/LidModeRelease"
          CODE_SIGNING_ALLOWED=NO
      - name: Verify embedded helper
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/LidModeRelease/Build/Products/Release/LidMode.app"
          test -x "$app/Contents/MacOS/LidModePrivilegedHelper"
          plutil -lint "$app/Contents/Library/LaunchDaemons/app.lidmode.PrivilegedHelper.plist"
